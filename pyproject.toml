[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commodity-shock-observatory"
version = "0.1.0"
description = "Event-driven commodity surveillance with Kafka, Spark and auditable macro research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "xgboost>=3,<4", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4",
  "confluent-kafka>=2.10,<3", "openpyxl>=3.1,<4",
  "prometheus-client>=0.22,<1", "websockets>=15,<16",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.7", "delta-spark==3.3.2"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.15,<0.16"]

[project.scripts]
cso = "observatory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
